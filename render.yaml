services:
  - type: web
    name: escale
    runtime: node
    rootDir: escale/server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FREE_ANALYSES
        value: "3"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NOTCHPAY_PUBLIC_KEY
        sync: false
      - key: NOTCHPAY_HASH_KEY
        sync: false
      - key: PREMIUM_PRICE_XAF
        value: "3300"
      - key: SITE_URL
        value: https://escale-site.onrender.com

  - type: web
    name: escale-site
    runtime: static
    buildCommand: echo "Site statique, rien a construire"
    staticPublishPath: ./escale/site
